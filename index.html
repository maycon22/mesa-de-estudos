<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob: https://cdnjs.cloudflare.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa de Estudos</title>
<meta name="description" content="Planner de estudos para concursos: ciclo, cronômetro, edital verticalizado, revisões e desempenho.">
<meta name="theme-color" content="#16201B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa de Estudos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: trilho de navegação à esquerda (barra rolável no topo no celular) + área de trabalho em blocos; marca-texto amarelo destaca "o que fazer agora". */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E8EDEA; --ink:#16201B; --muted:#5A6862; --line:#D8E0DB;
  --accent:#1F57D1; --accent-ink:#FFFFFF; --accent-soft:#E3EBFC;
  --mark:#F5DB4C; --mark-ink:#16201B;
  --good:#23845A; --warn:#B87A0C; --bad:#C23E36;
  --good-ink:#17603F; --warn-ink:#7A4F00; --bad-ink:#962620; --on-bad:#FFFFFF;
  --f-display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --sunk:#1C2622; --ink:#E6EDE9; --muted:#93A39B; --line:#283430;
  --accent:#86A6FF; --accent-ink:#0B1020; --accent-soft:#1D2A4A;
  --mark:#E2C93A; --mark-ink:#16201B;
  --good:#4FC48E; --warn:#E3AA3E; --bad:#F07A70; --good-ink:#4FC48E; --warn-ink:#E3AA3E; --bad-ink:#F07A70; --on-bad:#1A0B09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --sunk:#1C2622; --ink:#E6EDE9; --muted:#93A39B; --line:#283430;
  --accent:#86A6FF; --accent-ink:#0B1020; --accent-soft:#1D2A4A;
  --mark:#E2C93A; --mark-ink:#16201B;
  --good:#4FC48E; --warn:#E3AA3E; --bad:#F07A70; --good-ink:#4FC48E; --warn-ink:#E3AA3E; --bad-ink:#F07A70; --on-bad:#1A0B09; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--ink);margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.auth{max-width:420px;margin:6vh auto 0}
.auth .brand-big{font-family:var(--f-display);font-weight:800;font-size:1.6rem;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.auth .brand-big i{display:inline-block;width:18px;height:18px;background:var(--mark);border-radius:4px;transform:rotate(-8deg)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.sync{font-size:.75rem;color:var(--muted);padding:6px 10px}
.sync b{font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.82rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.shell.solo{grid-template-columns:minmax(0,1fr)}
.shell.solo main{max-width:none}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;padding:0 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;background:var(--mark);border-radius:3px;transform:rotate(-8deg)}
nav.rail a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav.rail a:hover{background:var(--sunk);color:var(--ink)}
nav.rail a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.badge{font-family:var(--f-mono);font-size:.72rem;background:var(--bad);color:var(--on-bad);border-radius:99px;padding:1px 7px}
.rail .tema{margin-top:auto;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-weight:500;cursor:pointer;text-align:left;white-space:nowrap}
.rail .tema:hover{background:var(--sunk);color:var(--ink)}
[data-tema-ciclo] .ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font-size:.7rem;line-height:1}
.rail .timer-mini{margin-top:8px;padding:10px;border-radius:8px;background:var(--mark);color:var(--mark-ink);font-family:var(--f-mono);font-weight:700;text-decoration:none;display:block}
.rail .timer-mini:hover{background:var(--mark);color:var(--mark-ink);filter:brightness(.96)}
main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1100px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}
.status{font-size:.82rem;color:var(--muted)}
.notice{font-size:.85rem;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:-8px 0 16px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h2,.panel>.ph{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stat .v{font-family:var(--f-mono);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .s{font-size:.82rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.mark{background:var(--mark);color:var(--mark-ink);border-color:transparent}
.btn.mark:hover{filter:brightness(.96)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad-ink)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.icon{padding:4px 8px;min-width:30px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=search],input[type=url],input[type=time],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{min-height:90px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;background:var(--bg);font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row .grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.end{justify-content:flex-end}
.between{justify-content:space-between}
.list{display:flex;flex-direction:column}
.list>.li{padding:11px 0;border-top:1px solid var(--line)}
.list>.li:first-child{border-top:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.75rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad-ink)}
.pill.neutral{background:var(--sunk);color:var(--muted)}

/* Próxima matéria: o destaque marca-texto */
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.next .hl{font-family:var(--f-display);font-weight:800;font-size:1.6rem;background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%);color:var(--ink);padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.plan{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.plan .blk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}

/* Cronômetro */
.clock{font-family:var(--f-mono);font-weight:700;font-size:clamp(3rem,13vw,6.5rem);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;text-align:center;padding:18px 0 8px}
.clock.running{color:var(--accent)}
.clock-sub{text-align:center;color:var(--muted);margin-bottom:18px}
.ctrl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ctrl .btn{min-width:120px;padding:12px 18px;font-size:1rem}
.pomo{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:14px}

/* Heatmap de constância */
.heat-wrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.heat-days{display:grid;grid-template-rows:repeat(7,12px);gap:3px;font-size:.65rem;color:var(--muted);line-height:12px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--sunk)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--sunk))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--sunk))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 80%,var(--sunk))}
.heat i[data-l="4"]{background:var(--accent)}
.heat i.today{outline:2px solid var(--mark);outline-offset:-1px}
.legend{display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* Gráficos de colunas */
.cols{display:grid;gap:8px;height:160px;padding-top:4px}
.cols .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%}
.cols .track{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;min-height:0}
.cols .b{width:100%;max-width:38px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.cols .b.zero{background:var(--sunk)}
.cols .t{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap;height:1.1em}
.cols .d{font-size:.72rem;color:var(--muted);white-space:nowrap}
.cols .d.now{color:var(--ink);font-weight:700}
.cols .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}

/* Painel: cores dos ambientes (nunca somar horas sem dizer de qual ambiente vieram) */
:root{--amb-con:#1E8A4C;--amb-fac:#2F6FDB;--amb-dev:#8A4FD0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--amb-con:#5BCB8A;--amb-fac:#86A6FF;--amb-dev:#BC9BF5}}
:root[data-theme="dark"]{--amb-con:#5BCB8A;--amb-fac:#86A6FF;--amb-dev:#BC9BF5}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pn-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.chip .dot{width:9px;height:9px;margin-right:6px;vertical-align:0}
.atalhos{display:flex;flex-wrap:wrap;gap:6px}
.amb-tag{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;color:var(--muted);white-space:nowrap}
.amb-tag i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.quebra{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:8px}
.quebra .amb-tag{white-space:normal;flex-wrap:wrap;min-width:0;max-width:100%}
.quebra .amb-tag b{color:var(--ink);font-family:var(--f-mono);font-weight:700}
.delta{font-family:var(--f-mono);font-weight:700;font-size:.8rem;white-space:nowrap}
.delta.up{color:var(--good-ink)}.delta.down{color:var(--bad-ink)}.delta.eq{color:var(--muted)}
.meta-amb{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.meta-amb:first-of-type{border-top:0;padding-top:0}
.meta-l .bar{margin-top:4px}
.dist{display:flex;flex-direction:column;gap:12px}
.dist .bar{margin-top:4px}
.cols .b.stack{display:flex;flex-direction:column-reverse;overflow:hidden;background:transparent}
.cols .b.stack.zero{background:var(--sunk)}
.cols .b.stack>i{display:block;width:100%;min-height:1px}
.cols.dense{gap:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:.82rem;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cmp .li .row{flex-wrap:wrap;row-gap:2px}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.cols.dense .t{display:none}.cols.dense .d{font-size:.62rem}}

.chip:disabled,.seg button:disabled{opacity:.5;cursor:not-allowed}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mark-pill{background:var(--mark);color:var(--mark-ink)}
.ciclos-grid{grid-template-columns:minmax(240px,300px) minmax(0,1fr);align-items:start}
.ciclo-item{width:100%;border:0;background:transparent;cursor:pointer;color:inherit;font:inherit;padding:11px 8px;border-radius:8px;gap:8px}
.ciclo-item:hover{background:var(--bg)}
.ciclo-item[aria-current="true"]{background:var(--accent-soft)}
.form.f5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:860px){.ciclos-grid{grid-template-columns:minmax(0,1fr)}.form.f5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ind-edital{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.ind-edital .stat .v{font-size:1.4rem}
.st-btn{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.95rem;line-height:1;display:grid;place-items:center;padding:0;color:var(--muted)}
.st-btn.st-andamento{color:var(--warn-ink);border-color:var(--warn)}
.st-btn.st-concluido{color:var(--good-ink);border-color:var(--good)}
.st-btn:disabled{cursor:default;opacity:.85}
.top-det{margin:4px 0 12px 34px;padding:14px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
@media (max-width:860px){.top-det{margin-left:0}.topico-bloco .topic{flex-wrap:wrap}.topico-bloco .topic .tn{flex:1 1 0;min-width:55%}.topico-bloco .topic .meta{order:3;flex-basis:100%;padding-left:34px;white-space:normal}}
.rev-form{margin-top:12px;padding:14px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.fc-estudo{text-align:center}
.fc-frente{font-family:var(--f-display);font-size:1.35rem;font-weight:700;padding:24px 8px;white-space:pre-line}
.fc-verso{padding:16px;border-top:1px dashed var(--line);white-space:pre-line;font-size:1.05rem}
.seg{flex-wrap:wrap;max-width:100%}
.fs-limpo{border:0;padding:0;margin:0;min-width:0;display:grid;gap:16px}
.linklike{border:0;background:none;padding:2px 0;min-height:24px;color:inherit;font:inherit;cursor:pointer;text-align:left}
.linklike:hover b{text-decoration:underline}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cal-c{min-height:86px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0;overflow:hidden}
.cal-c:hover{background:var(--bg)}
.cal-c.vazio{border:0;background:transparent;cursor:default}
.cal-c.hoje{border-color:var(--mark);box-shadow:inset 0 0 0 1px var(--mark)}
.cal-c.sel{background:var(--accent-soft)}
.cal-n{font-family:var(--f-mono);font-size:.8rem;font-weight:700}
.cal-ev{font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;padding:1px 5px;border-radius:4px}
.cal-ev.feito{opacity:.5;text-decoration:line-through}
.cal-aula{font-size:.66rem;color:var(--muted)}
@media (max-width:600px){.cal-c{min-height:54px;padding:3px}.cal-ev{font-size:0;height:6px;padding:0}.cal-aula{display:none}}
/* Faculdade */
.disc{border-top:1px solid var(--line)}
.disc:first-of-type{border-top:0}
.disc>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;align-items:center;gap:12px}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary .chev{transition:transform .15s;color:var(--muted)}
.disc[open]>summary .chev{transform:rotate(90deg)}
.disc .corpo{padding:0 0 16px 22px;display:flex;flex-direction:column;gap:14px}
.nota-big{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem;white-space:nowrap}
.aval td,.aval th{padding:6px 6px;vertical-align:middle}
.aval input{padding:5px 8px}
.aval .w-nome{min-width:150px}.aval .w-data{width:150px}.aval .w-num{width:82px}
.faltas{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.faltas .bar{flex:1;min-width:120px}
.aula-hoje{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}
@media (max-width:860px){.disc .corpo{padding-left:4px}}

/* Edital */
details.mat{border-top:1px solid var(--line)}
details.mat:first-of-type{border-top:0}

/* ---------- utilidades ---------- */

  const bloco = (ini, fim, rotulo, atual) => {
    const por = Object.fromEntries(ambs.map(a => [a, 0]));
    for (let d = ini; d <= fim; d = addDays(d, 1)) for (const a of ambs) por[a] += porDia[d]?.[a] || 0;
    return { ini, fim, rotulo, atual, por, total: Object.values(por).reduce((x, y) => x + y, 0) };
  };
  const produtividade = prod === "semanas"
    ? [...Array(12)].map((_, i) => { const ini = addDays(iniSem, -(11 - i) * 7); return bloco(ini, addDays(ini, 6), fmtShort(ini), i === 11); })
    : [...Array(14)].map((_, i) => { const d = addDays(hoje, i - 13); return bloco(d, d, String(parseYmd(d).getDate()), i === 13); });

  // sequência de dias com algum registro (hoje ainda conta como "em aberto")
  const dias = new Set(R.map(r => r.data));
  let atual = 0, d = dias.has(hoje) ? hoje : addDays(hoje, -1);
  while (dias.has(d)) { atual++; d = addDays(d, -1); }
  let recorde = 0, run = 0, ant = null;
  for (const x of [...dias].filter(x => x <= hoje).sort()) { run = ant && addDays(ant, 1) === x ? run + 1 : 1; recorde = Math.max(recorde, run); ant = x; }
  const minPorDia = {};
  for (const r of R) minPorDia[r.data] = (minPorDia[r.data] || 0) + r.min;

  return { ambs, periodos, comparativos, distribuicao, totalDist, produtividade, sequencia: { atual, recorde, estudouHoje: dias.has(hoje) }, minPorDia, vazio: !R.length };
}

/* Junta o tempo de todos os ambientes num formato só, sempre com o ambiente identificado. */
function registrosDeTempo() {
  const out = [];
  for (const s of sessoes()) { const m = mat(s.materiaId); out.push({ amb: "concursos", data: s.data, min: s.minutos || 0, alvo: s.materiaId || "-", nome: m?.nome || "Matéria removida", cor: m?.cor || "#8A8F8C" }); }
  for (const e of facEstudos()) { const d = facDisc(e.discId); out.push({ amb: "faculdade", data: e.data, min: e.minutos || 0, alvo: e.discId || "-", nome: d?.nome || (e.discId ? "Disciplina removida" : "Sem disciplina"), cor: d?.cor || "#8A8F8C" }); }
  for (const e of todosRegistros()) if (e.amb === "desenvolvimento") { const a = AMB_CFG.desenvolvimento.item(e.s.areaId); out.push({ amb: "desenvolvimento", data: e.s.data, min: e.s.minutos || 0, alvo: e.s.areaId || "-", nome: a?.nome || "Área removida", cor: a?.cor || "#8A8F8C" }); }
  return out;
}
function metasPorAmbiente(plano) {
  const c = S.config, f = c.fac;
  const auto = !(c.metaDiaria > 0);
  return {
    concursos: { dia: auto ? (plano.hojeConta ? plano.alvoHoje : 0) : c.metaDiaria * 60, diaAuto: auto, folga: auto && !plano.hojeConta, semana: c.metaSemanal * 60 },
    faculdade: { dia: (f.metaDiaria || 0) * 60, semana: (f.metaSemanal || 0) * 60 },
    desenvolvimento: { dia: 0, semana: 0 }
  };
}
function pendenciasPainel(incl, plano, ciclo, metaCon, feitoCon) {
  const t = today(), out = [];
  for (const a of AMBIENTES.map(x => x.id).filter(incl)) {
    const revs = revisoesPendentes().filter(r => r.origem.amb === a), atras = revs.filter(r => r.data < t).length, hoje = revs.filter(r => r.data === t).length;
    if (atras) out.push({ amb: a, nivel: "bad", txt: `${atras} ${atras === 1 ? "revisão atrasada" : "revisões atrasadas"}`, href: `#${a}/revisoes`, acao: "Revisar" });
    if (hoje) out.push({ amb: a, nivel: "warn", txt: `${hoje} ${hoje === 1 ? "revisão para hoje" : "revisões para hoje"}`, href: `#${a}/revisoes`, acao: "Revisar" });
  }
  if (incl("concursos")) {
    const falta = Math.max(0, metaCon.dia - feitoCon); // a mesma meta diária mostrada no quadro de Metas
    if (falta > 0) out.push({ amb: "concursos", nivel: "neutral", txt: `Faltam ${fmtH(falta)} para a meta de hoje`, ...(plano.blocos.length ? { study: `${plano.blocos[0].m.id}:${Math.min(plano.blocos[0].min, Math.ceil(falta / 10) * 10)}`, acao: "Estudar" } : { href: "#cronometro", acao: "Cronômetro" }) });
    if (ciclo.completo) out.push({ amb: "concursos", nivel: "good", txt: `${ciclo.ciclo.nome}: todas as horas cumpridas, conclua o ciclo`, href: "#ciclo", acao: "Abrir ciclo" });
    const atr = ciclo.R?.atrasadas || [];
    if (atr.length) out.push({ amb: "concursos", nivel: "warn", txt: `${plural(atr.length, "matéria atrasada", "matérias atrasadas")} no ciclo: ${atr.slice(0, 3).map(i => matOuRemovida(i.materiaId).nome).join(", ")}${atr.length > 3 ? "…" : ""}`, href: "#ciclo", acao: "Ver ciclo" });
  }
  if (incl("faculdade") && S.config.fac.semestres.length && semAtual()?.status !== "encerrado") {
    for (const p of pendenciasAcad(facDoSemestre(), S.config.fac.eventos.filter(e => e.semestreId === S.config.fac.semestreAtual), regrasDe, t).slice(0, 6))
      out.push({ amb: "faculdade", nivel: p.nivel, txt: p.txt, href: "#faculdade/fac-geral", acao: "Ver" });
  }
  const ordem = { bad: 0, warn: 1, neutral: 2, good: 3 };
  return out.sort((a, b) => ordem[a.nivel] - ordem[b.nivel]);
}
function provasPainel(incl) {
  const t = today(), lim = addDays(t, 60), out = [];
  if (incl("concursos")) {
    for (const c of S.config.concursos) if (c.dataProva && c.dataProva >= t) out.push({ amb: "concursos", nome: c.nome, sub: [bancaNome(c.bancaId), c.cargo].filter(Boolean).join(" · ") || "Prova do concurso", data: c.dataProva });
    if (S.config.dataProva && S.config.dataProva >= t && !S.config.concursos.some(c => c.dataProva === S.config.dataProva)) out.push({ amb: "concursos", nome: S.config.objetivo || "Prova do concurso", sub: "Prova do concurso", data: S.config.dataProva });
  }
  if (incl("faculdade")) for (const d of facDoSemestre()) for (const a of d.avaliacoes) if (a.data && a.nota == null && a.data >= t && a.data <= lim) out.push({ amb: "faculdade", nome: a.nome, sub: d.nome, data: a.data });
  return out.sort((a, b) => a.data.localeCompare(b.data));
}

function stackChart(itens, ambs, goal = 0) {

function heatmap(semanas, pd = minutosPorDia()) {
  const dias = new Set(Object.keys(pd)); const ini = addDays(weekStart(today()), -(semanas - 1) * 7), t = today(); let cells = "";
  for (let i = 0; i < semanas * 7; i++) {
    const x = addDays(ini, i); const m = pd[x] || 0;
    const l = x > t ? -1 : !dias.has(x) ? 0 : m < 60 ? 1 : m < 120 ? 2 : m < 240 ? 3 : 4;
    cells += l < 0 ? `<i style="visibility:hidden"></i>` : `<i data-l="${l}" class="${x === t ? "today" : ""}" title="${fmtDate(x)}: ${fmtH(m)}"></i>`;
  }
  return `<div class="heat-wrap"><div class="heat-days"><span>seg</span><span></span><span>qua</span><span></span><span>sex</span><span></span><span>dom</span></div><div class="heat">${cells}</div></div>
    <div class="legend" style="margin-top:8px">0 <i style="background:var(--sunk)"></i><i style="background:color-mix(in srgb,var(--accent) 30%,var(--sunk))"></i><i style="background:color-mix(in srgb,var(--accent) 55%,var(--sunk))"></i><i style="background:color-mix(in srgb,var(--accent) 80%,var(--sunk))"></i><i style="background:var(--accent)"></i> 4h+</div>`;
}

/* Reparte meias horas pelo método do maior resto, com no mínimo 30 min por matéria. */
function repartir(itens, pesos, totalH) {
  const meias = Math.max(itens.length, Math.round(totalH * 2)); const soma = pesos.reduce((a, b) => a + b, 0) || 1;
  const bruto = itens.map((i, k) => ({ i, q: Math.max(1, meias * pesos[k] / soma) }));
  bruto.forEach(x => x.n = Math.max(1, Math.floor(x.q)));
  let resto = meias - bruto.reduce((a, x) => a + x.n, 0);
  [...bruto].sort((a, b) => (b.q - Math.floor(b.q)) - (a.q - Math.floor(a.q))).forEach(x => { if (resto > 0) { x.n++; resto--; } });
  while (resto > 0) { bruto.sort((a, b) => b.q - a.q)[0].n++; resto--; }
  while (resto < 0) { const x = bruto.filter(y => y.n > 1).sort((a, b) => b.n - a.n)[0]; if (!x) break; x.n--; resto++; }
  bruto.forEach(x => x.i.horas = x.n / 2);
}

const IMP = { aberto: false, texto: "", origem: "", cargo: "", status: "", erro: "", ocupado: false, resultado: null, modo: "somar", abertos: new Set(), ctrl: null, destino: "", concNome: "", banca: null };
const semAcento = s => [...String(s)].map(ch => ch.normalize("NFD")[0]).join("");   // mesmo comprimento do original

const NAO_SIGLA = new Set(["lei","uso","seu","sua","não","sem","ser","ter","fim","rio","mar"]);
function tituloCaso(s) {
  s = s.trim().replace(/\s+/g, " ").replace(/^(?:\d+(?:\.\d+)*\.?|[IVXLC]+\s*[.)\-–]|[a-z]\s*[.)\-–])\s+/i, "").replace(/[\s:.\-–]+$/, "");
  if (/[a-zà-ú]/.test(s)) return s;
  return s.split(" ").map((w, i) => { const l = w.toLowerCase();
    if (w.includes("-") && w.length <= 8) return w;
    const nu = w.replace(/[^A-Za-zÀ-ú]/g, "");
    if (nu.length >= 2 && nu.length <= 4 && /^[A-ZÀ-Ú]+$/.test(nu) && (nu.length <= 3 || /^\(.*\)$/.test(w)) && !MINUS.has(nu.toLowerCase()) && !NAO_SIGLA.has(nu.toLowerCase())) return w;
    if (i > 0 && MINUS.has(l)) return l;
    return l.charAt(0).toUpperCase() + l.slice(1); }).join(" ");
}
function casarMateria(nome) {

  for (const m of S.config.materias) { const mk = chave(m.nome); if (mk === k) return m.id; if (!parcial && k.length > 5 && mk.length > 5 && (k.includes(mk) || mk.includes(k))) parcial = m.id; }

function mesclarMaterias(lista) {
  const mapa = new Map();
  const limpar = t => { t = String(t || "").replace(/\s+/g, " ").replace(/^[\s\d.)\-–•]+(?=[A-Za-zÀ-ú"“(])/, "").replace(/[\s.;,]+$/, "").trim(); return t.length > 300 ? t.slice(0, 297).trimEnd() + "…" : t; };
  for (const x of lista) {
    const nome = tituloCaso(String(x?.nome || "")); const k = chave(nome); if (k.length < 3) continue;
    const alvo = mapa.get(k) || { nome, topicos: [], duvidosos: [], vistos: new Set(), feitos: new Set(), horas: null, confianca: "alta", motivos: new Set() }; mapa.set(k, alvo);
    const ordem = { alta: 0, media: 1, baixa: 2 }; const cf = x.confianca in ordem ? x.confianca : "media";
    if (ordem[cf] > ordem[alvo.confianca]) alvo.confianca = cf; if (x.motivo) alvo.motivos.add(x.motivo);
    if (alvo.horas == null && Number.isFinite(x.horas) && x.horas >= 0) alvo.horas = Math.min(40, Math.round(x.horas * 2) / 2);
    for (let t of Array.isArray(x.topicos) ? x.topicos : []) {
      let feito = false, subs = [];
      if (t && typeof t === "object") { feito = !!t.feito; subs = t.sub || t.subtopicos || []; t = t.nome; }
      t = limpar(t); const kt = chave(t); if (t.length < 3) continue;
      subs = [...new Set((Array.isArray(subs) ? subs : []).map(s => limpar(typeof s === "object" ? s?.nome : s)).filter(s => s.length >= 2))];
      if (feito) alvo.feitos.add(kt);
      if (duvidoso(t)) { if (!alvo.duvidosos.some(d => chave(d.nome) === kt)) alvo.duvidosos.push({ nome: t, sub: subs }); continue; }
      const ex = alvo.topicos.find(o => chave(o.nome) === kt);
      if (ex) { for (const s of subs) if (!ex.sub.some(o => chave(o) === chave(s))) ex.sub.push(s); continue; }
      alvo.topicos.push({ nome: t, sub: subs.slice(0, 60) });
    }
  }
  return [...mapa.values()].filter(m => m.topicos.length || m.duvidosos.length).map(m => {
    if (m.duvidosos.length) m.motivos.add(`${plural(m.duvidosos.length, "trecho separado", "trechos separados")} por não parecer conteúdo de estudo`);

  });

/* Leitura de PDF com pdf.js (carregado só quando necessário; roda na própria página) */
let pdfPronto = null;
const loadScript = src => new Promise((ok, erro) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => erro(new Error("script")); document.head.appendChild(el); });
function carregarPdfJs() {
  return pdfPronto ||= (async () => {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base + "pdf.worker.min.js"); await loadScript(base + "pdf.min.js");
    const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; return lib;
  })().catch(e => { pdfPronto = null; throw e; });
}
const impStatus = msg => { IMP.status = msg; const el = $("#impStatus"); if (el) { el.textContent = msg; el.style.color = ""; } };
async function extrairPdf(file) {
  impStatus("Preparando a leitura do PDF…");
  const lib = await carregarPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const paginas = [];
  for (let i = 1; i <= doc.numPages; i++) {
    impStatus(`Lendo página ${i} de ${doc.numPages}…`);
    const tc = await (await doc.getPage(i)).getTextContent();
    let t = ""; for (const it of tc.items) { t += it.str || ""; t += it.hasEOL ? "\n" : (it.str && !/\s$/.test(it.str) ? " " : ""); }
    paginas.push(t.replace(/[ \t]+/g, " "));
  }
  // remove cabeçalhos e rodapés que se repetem em muitas páginas
  const norm = l => l.trim().replace(/\d+/g, "#").replace(/\s+/g, " ").toLowerCase();
  const freq = {}; paginas.forEach(p => new Set(p.split("\n").map(norm).filter(l => l.length > 3)).forEach(l => freq[l] = (freq[l] || 0) + 1));
  const lim = Math.max(3, doc.numPages * 0.3);
  return paginas.map(p => p.split("\n").filter(l => doc.numPages < 4 || (freq[norm(l)] || 0) < lim).join("\n")).join("\n");
}

let xlsxPronto = null;
const carregarXlsx = () => xlsxPronto ||= loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js").then(() => window.XLSX).catch(e => { xlsxPronto = null; throw e; });
const SIM = /^(sim|s|x|ok|1|true|verdadeiro|concluido|concluida|feito|estudado|✓|✔)$/;
function lerPlanilha(wb, XLSX) {
  const out = [];
  for (const aba of wb.SheetNames) {
    if (/como preencher|instruc|leia/.test(chave(aba))) continue;
    const linhas = XLSX.utils.sheet_to_json(wb.Sheets[aba], { header: 1, defval: "", raw: false, blankrows: false });
    if (!linhas.length) continue;
    let ini = 0, cM = 0, cT = 1, cH = -1, cC = -1, cS = -1;
    for (let i = 0; i < Math.min(15, linhas.length); i++) {
      const r = linhas[i].map(v => chave(v));
      const m = r.findIndex(v => /^(materia|disciplina)/.test(v)), t = r.findIndex(v => /^(topico|conteudo|assunto|item)/.test(v));
      if (m >= 0 && t >= 0) { ini = i + 1; cM = m; cT = t; cH = r.findIndex(v => /^(horas|hora|cargahoraria)/.test(v)); cC = r.findIndex(v => /^(concluid|feito|estudado|status|ok$)/.test(v)); cS = r.findIndex(v => /^subtopico/.test(v)); break; }
    }
    let atual = null;
    for (let i = ini; i < linhas.length; i++) {
      const r = linhas[i]; const m = String(r[cM] ?? "").trim(), t = String(r[cT] ?? "").trim();
      if (m) { const k = chave(m); atual = out.find(x => chave(x.nome) === k); if (!atual) { atual = { nome: m, horas: null, topicos: [], confianca: "alta", motivo: "planilha" }; out.push(atual); } }
      if (!atual) continue;
      if (cH >= 0 && atual.horas == null && String(r[cH] ?? "").trim() !== "") { const h = parseFloat(String(r[cH]).replace(",", ".")); if (Number.isFinite(h)) atual.horas = h; }
      if (t) atual.topicos.push({ nome: t, sub: [], feito: cC >= 0 && SIM.test(chave(r[cC]) || String(r[cC] ?? "").trim()) });
      const sub = cS >= 0 ? String(r[cS] ?? "").trim() : ""; const ult = atual.topicos[atual.topicos.length - 1];
      if (sub && ult) ult.sub.push(sub);
    }
  }
  return out;
}

  XLSX.utils.book_append_sheet(wb, ws, "Edital"); XLSX.utils.book_append_sheet(wb, wi, "Como preencher");
  const dados = XLSX.write(wb, { bookType: "xlsx", type: "array" });

  const url = URL.createObjectURL(new Blob([dados], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));

/* Reconhecimento sem IA */
const RE_TITULO = /([A-ZÁÂÃÀÉÊÍÓÔÕÚÇ][A-ZÁÂÃÀÉÊÍÓÔÕÚÇ0-9 ,\-–\/()ºª]{2,100}?)\s*:/g;
const RE_LINHA = /^[A-ZÁÂÃÀÉÊÍÓÔÕÚÇIVX0-9][A-ZÁÂÃÀÉÊÍÓÔÕÚÇ0-9 ,\-–\/()ºª.]{3,100}$/;
const GRUPO = /^(conhecimentos|parte|bloco|modulo|grupo|cargo|cargos|anexo|nivel|disciplinas|prova|provas|conteudo|conteudos|objetos|habilidades|eixo|area|especialidade|para todos|d[ao]s?|edital|cronograma|quadro|tabela|item|subitem)\b/;
const letras = t => t.replace(/[^A-Za-zÀ-ú]/g, "").length;
function acharTitulos(txt) {
  const out = [];
  for (const m of txt.matchAll(RE_TITULO)) { const t = m[1].trim(); if (letras(t) >= 4 && t.split(/\s+/).length <= 14) out.push({ i: m.index, fim: m.index + m[0].length, t }); }
  let pos = 0;
  for (const linha of txt.split("\n")) { const t = linha.trim(); if (RE_LINHA.test(t) && letras(t) >= 4 && !/[a-zà-ú]/.test(t) && !/:$/.test(t)) { const i = pos + linha.indexOf(t); out.push({ i, fim: i + t.length, t }); } pos += linha.length + 1; }
  out.sort((a, b) => a.i - b.i);
  const limpo = []; for (const h of out) if (!limpo.length || h.i >= limpo[limpo.length - 1].fim) limpo.push(h);
  return limpo.map(h => ({ ...h, grupo: GRUPO.test(semAcento(tituloCaso(h.t).toLowerCase())) || /\bCARGO\b/.test(h.t) }));
}
function reconhecer(txt) {
  const tit = acharTitulos(txt); const brutas = [];
  tit.forEach((h, k) => {
    if (h.grupo) return;
    let conteudo = txt.slice(h.fim, k + 1 < tit.length ? tit[k + 1].i : txt.length).slice(0, 25000);
    // o conteúdo da última matéria não pode engolir o resto do edital (próximo item do edital ou anexo)
    const corte = conteudo.search(/\n\s*(?:ANEXO\b|\d{1,2}(?:\.\d{1,2})*\.?\s+D[AO]S?\s+[A-ZÁÂÃÉÊÍÓÔÕÚÇ]{3})/); if (corte > 0) conteudo = conteudo.slice(0, corte);
    if (conteudo.replace(/\s/g, "").length < 12) return;
    const nome = tituloCaso(h.t); if (nome.length < 4 || nome.length > 90) return;
    const hz = separarHierarquia(conteudo); brutas.push({ nome, topicos: hz.topicos, confianca: hz.confianca, motivo: hz.motivo });
  });
  return mesclarMaterias(brutas);
}
/* Escolhe onde começa o conteúdo programático (e, se informado, o cargo) */
function recortar(txt, cargo, usarCargo) {
  const low = semAcento(txt.toLowerCase());
  const cands = [];
  for (const k of ["conteudos programaticos", "conteudo programatico", "objetos de avaliacao", "programa das provas", "programas das provas"]) {
    let i = low.indexOf(k); while (i >= 0) { cands.push(i); i = low.indexOf(k, i + 1); }
  }
  let ini = 0;
  if (cands.length) { // fica com a ocorrência seguida de mais títulos de matéria
    let melhor = -1; for (const i of cands) { const n = acharTitulos(txt.slice(i, i + 20000)).filter(h => !h.grupo).length; if (n > melhor) { melhor = n; ini = i; } }
  }
  let achouCargo = null, gerais = "";
  let fim = txt.length;
  const palavras = semAcento(String(cargo || "").toLowerCase()).split(/[^a-z0-9]+/).filter(Boolean);
  if (palavras.length && usarCargo) {
    // o PDF quebra linhas no meio do nome do cargo: aceita qualquer espaço ou pontuação entre as palavras
    const reCargo = new RegExp(palavras.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("[^a-z0-9]+"));
    const m = reCargo.exec(low.slice(ini)); achouCargo = !!m;
    if (m) {
      // matérias comuns a todos os cargos costumam vir antes do bloco do cargo: entram também
      const ie = low.indexOf("conhecimentos especificos", ini);
      if (ie > ini && ie < ini + m.index) gerais = txt.slice(ini, ie);
      ini += m.index;
      // termina no título de conteúdo de outro cargo (ex.: "conhecimentos específicos para o cargo B02")
      const reBloco = /conhecimentos\s+(?:especificos|gerais)\s+para\s+os?\s+cargos?/g; reBloco.lastIndex = ini + 1; let b;
      while ((b = reBloco.exec(low))) { if (!reCargo.test(low.slice(b.index, b.index + 300))) { fim = b.index; break; } }
    }
  }
  return { trecho: (gerais ? gerais + "\n" : "") + txt.slice(ini, fim), achouCargo };
}

/* Leitura com o Claude */
const promptEdital = (trecho, k, n, cargo) => `Você está ajudando a montar um edital verticalizado de concurso público brasileiro.
Abaixo está ${n > 1 ? `a parte ${k + 1} de ${n} de ` : ""}um trecho do edital (texto extraído de PDF, com quebras de linha soltas e possíveis cabeçalhos ou rodapés de página no meio).

Tarefa: extraia as disciplinas (matérias) e os tópicos do conteúdo programático${cargo ? ` do cargo "${cargo}". Se o edital tiver vários cargos, considere só as disciplinas cobradas desse cargo, incluindo as comuns a todos os cargos` : ""}.

Regras:
- Cada disciplina vira um item com "nome" (como no edital, em formato de título, por exemplo "Direito Administrativo", nunca em caixa alta) e "topicos" (lista de textos).
- Cada item numerado de nível superior (1, 2, 3...) vira um tópico. Subitens (1.1, 1.2...) vão na lista "subtopicos" do tópico pai.
- Em cada disciplina, informe "confianca": "alta" quando a lista de tópicos está clara no edital; "media" quando precisou interpretar a divisão; "baixa" quando não tem certeza de que o trecho é conteúdo programático dessa disciplina.
- Sem numeração, separe os assuntos pelos pontos e vírgulas ou pelos pontos finais.
- Mantenha a redação do edital, sem a numeração, com no máximo 220 caracteres por tópico (termine com "…" se precisar cortar).
- Não invente nada. Ignore cabeçalhos, rodapés, números de página, regras do concurso, cronogramas e bibliografia.
- Se o trecho não tiver conteúdo programático, use "materias": [].
- Use "fim": true se todo o conteúdo programático já terminou dentro deste trecho (começou um anexo de outro assunto ou o fim do edital); senão "fim": false.

Responda só com JSON neste formato:
{"materias":[{"nome":"Direito Administrativo","confianca":"alta","topicos":[{"nome":"Atos administrativos","subtopicos":["Conceito e requisitos","Atributos"]},{"nome":"Poderes da Administração","subtopicos":[]}]}],"fim":false}

Trecho do edital:
"""
${trecho}
"""`;
const ERROS_IA = { not_granted: "O uso do Claude nesta página não foi permitido. Use o reconhecimento automático ou libere nas permissões da página.", sampling_disabled: "O Claude não está disponível nesta conta para páginas. Use o reconhecimento automático.", rate_limited: "Limite de uso do Claude atingido no momento. Tente mais tarde ou use o reconhecimento automático.", session_expired: "Sua sessão expirou. Entre novamente e tente de novo.", prompt_too_large: "O trecho ficou grande demais. Informe o cargo ou cole só o conteúdo programático.", invalid_json: "A resposta veio incompleta. Informe o cargo para reduzir o trecho ou cole só o conteúdo programático.", refused: "O Claude não conseguiu processar este texto. Use o reconhecimento automático." };
async function lerComClaude() {
  const { trecho } = recortar(IMP.texto, IMP.cargo, false);
  const TAM = 60000, partes = [];
  for (let i = 0; i < trecho.length && partes.length < 8; i += TAM) partes.push(trecho.slice(i, i + TAM));
  const cortado = trecho.length > TAM * 8;
  IMP.ctrl ||= new AbortController(); const todas = [];
  try {
    for (let k = 0; k < partes.length; k++) {
      impStatus(`O Claude está lendo o edital${partes.length > 1 ? ` (parte ${k + 1} de ${partes.length})` : ""}… isso pode levar um minuto.`);
      const r = await sampleFn.json(promptEdital(partes[k], k, partes.length, IMP.cargo.trim()), { signal: IMP.ctrl.signal, modelTier: "default" });
      if (Array.isArray(r?.materias)) todas.push(...r.materias);
      if (r?.fim === true && todas.length) break;
    }
  } catch (e) {
    if (e?.code === "cancelled") { IMP.erro = todas.length ? "" : "Leitura cancelada."; }
    else if (!todas.length) throw e;
    else IMP.erro = "Parte do edital não pôde ser lida; revise se faltou alguma matéria.";
  } finally { IMP.ctrl = null; }
  if (cortado) IMP.erro = "O edital é muito longo e só o começo do conteúdo foi lido. Informe o cargo ou cole o trecho que falta.";
  return mesclarMaterias(todas);
}

async function lerMaterial(file) {

    return { nome: file.name, paginas: doc.numPages, texto: partes.join("\n").trim() };
  }

  return { nome: file.name, paginas: 0, texto: (await file.text()).trim() };
}

    for (let i = 0; i < lista.length; i += 100) { try { const { error } = await sb.storage.from("materiais").remove(lista.slice(i, i + 100)); if (error) arqFalhas += Math.min(100, lista.length - i); } catch { arqFalhas += Math.min(100, lista.length - i); } }
  } else {
    const a = await (window.claude?.use?.("assets") || Promise.resolve(null)).catch(() => null);
    for (const x of arquivos.filter(x => x.onde === "assets")) { try { await a?.delete(x.ref); } catch { arqFalhas++; } }
  }
  // 5. este aparelho: cópia local dos dados, pendências, filtros e cronômetro (o tema fica)
  const meu = uid || (typeof artUid !== "undefined" ? artUid : "");
  try { for (const k of Object.keys(localStorage)) if (/^mesa-/.test(k) && k !== "mesa-tema" && (!k.includes(":") || (meu && k.endsWith(":" + meu)))) localStorage.removeItem(k); } catch {}
  if (!manterCopia) { try { await apagarTodasCopias(); } catch {} }
  try { sessionStorage.setItem("mesa-zerado", JSON.stringify({ arqFalhas, copia: !!copiaId })); } catch {}
  S.config = null; S.months = {}; S.srv = {}; S.chaves = []; S.confirmado = true; ZER.aberto = false; ZER.ocupado = false;
  history.replaceState(null, "", location.pathname + location.search);
  render();
  try { location.reload(); } catch {}
}
/* Primeiro acesso depois de zerar: oferece desfazer com a cópia guardada neste aparelho */
async function mostrarCopiaZerar() {
  const L = await listarCopias(), c = (L || []).find(x => x.motivo === "antes de zerar"), el = $("#setupCopia");
  if (!c || !el || S.config) return;
  el.innerHTML = `<div class="panel" style="margin-top:16px"><h2>Desfazer: dados de antes de zerar</h2>
    <p class="muted" style="margin:8px 0 14px">Cópia guardada neste aparelho em ${quandoTs(c.em)}: ${esc(fmtResumo(c.resumo))}.</p>
    <div class="row wrap" style="gap:8px"><button class="btn primary" id="zRest">Restaurar esses dados</button><button class="btn" id="zBaixarCopia">Baixar a cópia</button><button class="btn ghost danger" id="zApagarCopia">Apagar a cópia</button></div></div>`;
  $("#zRest").onclick = async () => {
    const x = await lerCopia(c.id);
    if (!x || sha256(canon(x.conteudo)) !== x.hash) { toast("A cópia não passou na conferência de integridade. Nada foi alterado."); return; }
    ZERANDO = false; S.config = normalizeConfig(JSON.parse(JSON.stringify(x.conteudo.config)));
    S.months = Object.fromEntries(Object.entries(x.conteudo.meses || {}).map(([k, v]) => [k, normalizeMes(JSON.parse(JSON.stringify(v)))]));
    saveConfig(); for (const k of Object.keys(S.months)) saveMonth(k);
    registrarSync("restauracao", "-", "dados de antes de zerar restaurados da cópia deste aparelho"); render(); toast("Dados restaurados");
  };
  $("#zBaixarCopia").onclick = async () => { const x = await lerCopia(c.id); if (!x) return;
    const txt = JSON.stringify({ app: "mesa-de-estudos", formato: 3, exportadoEm: new Date(x.em).toISOString(), resumo: x.resumo, integridade: { algoritmo: "SHA-256", hash: x.hash }, conteudo: x.conteudo }, null, 1);
    try { await salvarArquivoLocal(`mesa-de-estudos-antes-de-zerar-${ymd(new Date(x.em))}.json`, txt, "application/json"); } catch { toast("Não foi possível baixar"); } };
  $("#zApagarCopia").onclick = async () => { const b = $("#zApagarCopia"); if (!armed(b, "Apagar a cópia?")) return; await apagarCopia(c.id); el.innerHTML = ""; toast("Cópia apagada"); };
}
function viewAjustes() {
  return `<div class="head"><div><div class="label">Preferências</div><h1>Ajustes</h1></div></div><!--note-->
  ${modulosCfgHtml()}
  <form class="panel" id="aForm" style="margin-top:16px"><h2>Metas e rotina de estudo</h2>
    <div class="aj-grupo"><h3 class="aj-gt">Geral</h3><div class="form">
      <div class="field span2"><span>Dias em que você estuda (usados no plano de hoje)</span><div class="chips" id="aDias" role="group" aria-label="Dias de estudo">${[1,2,3,4,5,6,0].map(d => `<button type="button" class="chip" data-dia="${d}" aria-pressed="${S.config.diasEstudo.includes(d)}">${DOW[d]}</button>`).join("")}</div></div>
      <label class="field span2"><span>Intervalos de revisão (dias, separados por vírgula)</span><input type="text" id="aRev" value="${S.config.revisoes.join(", ")}"><small class="aj-dica">Ex.: 1, 7, 30. Valem para as revisões novas.</small></label>
    </div></div>
    <div class="aj-grupo" ${modAtivo("concursos") ? "" : "hidden"}><h3 class="aj-gt"><span class="dot" style="background:var(--amb-con)"></span>Concursos</h3><div class="form">
      <label class="field span2"><span>Objetivo (aparece no Painel)</span><input type="text" id="aObj" value="${esc(S.config.objetivo)}" maxlength="80"></label>
      <label class="field span2"><span>Data da prova</span><input type="date" id="aProva" value="${esc(S.config.dataProva)}"></label>
      <label class="field span2"><span>Meta semanal (horas)</span><input type="number" id="aMeta" min="1" max="100" step="1" value="${S.config.metaSemanal}"></label>
      <label class="field span2"><span>Meta diária (horas)</span><input type="number" id="aMetaDia" min="0" max="24" step="0.5" value="${S.config.metaDiaria}"><small class="aj-dica">0 = a sugerida pelo plano do dia.</small></label>
    </div></div>
    <div class="aj-grupo" ${modAtivo("faculdade") ? "" : "hidden"}><h3 class="aj-gt"><span class="dot" style="background:var(--amb-fac)"></span>Faculdade</h3><div class="form">
      <label class="field span2"><span>Meta diária (horas)</span><input type="number" id="aFacDia" min="0" max="24" step="0.5" value="${S.config.fac.metaDiaria}"><small class="aj-dica">0 = sem meta.</small></label>
      <label class="field span2"><span>Meta semanal (horas)</span><input type="number" id="aFacSem" min="0" max="100" step="0.5" value="${S.config.fac.metaSemanal}"><small class="aj-dica">0 = sem meta.</small></label>
    </div></div>
    <div class="row end" style="margin-top:14px"><button class="btn primary" type="submit">Salvar ajustes</button></div>
  </form>
  <div class="panel" style="margin-top:16px"><h2>Aparência</h2>
    <p class="muted" style="margin:8px 0 12px">Automático segue o tema do seu aparelho. A escolha vale para este aparelho.</p>
    <div class="chips" role="group" aria-label="Tema">${Object.entries(TEMAS).map(([k, t]) => `<button type="button" class="chip" data-tema="${k}" aria-pressed="${k === tema}">${t.ic} ${t.nome}</button>`).join("")}</div></div>
  ${segurancaHtml()}
  <div class="panel" style="margin-top:16px"><h2 style="margin-bottom:8px">Onde seus dados ficam</h2>
    <p class="muted" style="max-width:65ch">Matérias, sessões e revisões ficam salvas na sua conta e sincronizam entre os aparelhos em que você entrar. Sem internet, o app continua funcionando com a cópia deste aparelho e envia as alterações quando a conexão voltar. O cronômetro em andamento fica só neste aparelho.</p></div>
  <div class="panel" style="margin-top:16px"><div class="ph"><h2>Conta</h2></div>
    <div class="row wrap between"><span class="muted">Conectado como <b style="color:var(--ink)">${esc(S.email)}</b></span><button class="btn" id="sair">Sair da conta</button></div>
    <label class="row small" style="gap:8px;margin-top:10px"><input type="checkbox" id="sairCopias"> Aparelho compartilhado: ao sair, apagar também as cópias automáticas guardadas aqui</label>
    <p class="muted small" style="margin-top:6px">Ao sair, a cópia dos seus dados guardada neste navegador é apagada. Seus dados continuam na sua conta.</p></div>  ${zerarHtml()}`;
}
function bindAjustes() {
  bindModulosCfg(); bindZerar();
  $$("#aDias .chip").forEach(b => b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"));
  $("#aForm").onsubmit = e => { e.preventDefault();
    const revs = $("#aRev").value.split(/[,;\s]+/).map(Number).filter(n => Number.isInteger(n) && n > 0 && n < 400);
    const dias = $$("#aDias .chip[aria-pressed=true]").map(b => +b.dataset.dia);
    S.config.objetivo = $("#aObj").value.trim(); S.config.dataProva = $("#aProva").value; S.config.metaSemanal = Math.min(100, Math.max(1, parseInt($("#aMeta").value, 10) || 20));
    const meiaHora = (v, max) => Math.min(max, Math.max(0, Math.round((parseFloat(String(v).replace(",", ".")) || 0) * 2) / 2));
    S.config.metaDiaria = meiaHora($("#aMetaDia").value, 24); S.config.fac.metaDiaria = meiaHora($("#aFacDia").value, 24); S.config.fac.metaSemanal = meiaHora($("#aFacSem").value, 100);
    if (revs.length) S.config.revisoes = [...new Set(revs)].sort((a, b) => a - b);
    if (dias.length) S.config.diasEstudo = dias;
    saveConfig(); render(); toast(!dias.length ? "Ajustes salvos. Marque ao menos um dia de estudo; os dias anteriores foram mantidos." : revs.length ? "Ajustes salvos" : "Ajustes salvos. Os intervalos de revisão eram inválidos e foram mantidos."); };
  const showArea = () => { const a = $("#expArea"); a.value = backupJson(); a.hidden = false; a.focus(); a.select(); };
  $("#expBtn").onclick = async () => {
    try {
      const url = URL.createObjectURL(new Blob([backupJson()], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = `mesa-de-estudos-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000); toast("Backup baixado");
    } catch { showArea(); toast("Não deu para baixar. Copie o texto abaixo."); }
  };
  $("#expCopy").onclick = async () => { try { await navigator.clipboard.writeText(backupJson()); toast("Dados copiados"); } catch { showArea(); toast("Selecione e copie o texto abaixo"); } };
  bindSeguranca();
  $("#sair").onclick = async () => {
    const n = pendentesLocais().size;
    if (n && !armed($("#sair"), `Há ${n} alteração(ões) não enviadas. Sair mesmo assim?`)) return;
    if ($("#sairCopias")?.checked) { try { await apagarTodasCopias(); } catch {} }
    // apaga a cópia local dos dados e o que for desta conta (o tema do aparelho fica)
    try { for (const k of Object.keys(localStorage)) if (/^mesa-/.test(k) && k !== "mesa-tema") localStorage.removeItem(k); } catch {}
    await sb.auth.signOut().catch(() => {}); trocarUsuario(null);
  };
}

if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
try { const z = JSON.parse(sessionStorage.getItem("mesa-zerado") || "null"); if (z) { sessionStorage.removeItem("mesa-zerado"); setTimeout(() => toast(`Tudo apagado. O app está zerado${z.copia ? "; uma cópia de segurança ficou só neste aparelho" : ""}.${z.arqFalhas ? ` ${z.arqFalhas} arquivo(s) não foram apagados do armazenamento.` : ""}`), 900); } } catch {}
render();
boot();
})();
