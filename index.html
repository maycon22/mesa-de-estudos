<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa de Estudos</title>
<meta name="description" content="Planner de estudos para concursos: ciclo, cronômetro, edital verticalizado, revisões e desempenho.">
<meta name="theme-color" content="#16201B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa de Estudos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: trilho de navegação à esquerda (barra rolável no topo no celular) + área de trabalho em blocos; marca-texto amarelo destaca "o que fazer agora". */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E8EDEA; --ink:#16201B; --muted:#5A6862; --line:#D8E0DB;
  --accent:#1F57D1; --accent-ink:#FFFFFF; --accent-soft:#E3EBFC;
  --mark:#F5DB4C; --mark-ink:#16201B;
  --good:#23845A; --warn:#B87A0C; --bad:#C23E36;
  --f-display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --sunk:#1C2622; --ink:#E6EDE9; --muted:#93A39B; --line:#283430;
  --accent:#86A6FF; --accent-ink:#0B1020; --accent-soft:#1D2A4A;
  --mark:#E2C93A; --mark-ink:#16201B;
  --good:#4FC48E; --warn:#E3AA3E; --bad:#F07A70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --sunk:#1C2622; --ink:#E6EDE9; --muted:#93A39B; --line:#283430;
  --accent:#86A6FF; --accent-ink:#0B1020; --accent-soft:#1D2A4A;
  --mark:#E2C93A; --mark-ink:#16201B;
  --good:#4FC48E; --warn:#E3AA3E; --bad:#F07A70; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--ink);margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.auth{max-width:420px;margin:6vh auto 0}
.auth .brand-big{font-family:var(--f-display);font-weight:800;font-size:1.6rem;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.auth .brand-big i{display:inline-block;width:18px;height:18px;background:var(--mark);border-radius:4px;transform:rotate(-8deg)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.sync{font-size:.75rem;color:var(--muted);padding:6px 10px}
.sync b{font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.82rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;padding:0 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;background:var(--mark);border-radius:3px;transform:rotate(-8deg)}
nav.rail a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav.rail a:hover{background:var(--sunk);color:var(--ink)}
nav.rail a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.badge{font-family:var(--f-mono);font-size:.72rem;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.rail .timer-mini{margin-top:auto;padding:10px;border-radius:8px;background:var(--mark);color:var(--mark-ink);font-family:var(--f-mono);font-weight:700;text-decoration:none;display:block}
.rail .timer-mini:hover{background:var(--mark);color:var(--mark-ink);filter:brightness(.96)}
main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1100px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}
.status{font-size:.82rem;color:var(--muted)}
.notice{font-size:.85rem;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:-8px 0 16px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h2,.panel>.ph{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stat .v{font-family:var(--f-mono);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .s{font-size:.82rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.mark{background:var(--mark);color:var(--mark-ink);border-color:transparent}
.btn.mark:hover{filter:brightness(.96)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.icon{padding:4px 8px;min-width:30px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{min-height:90px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;background:var(--bg);font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row .grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.end{justify-content:flex-end}
.between{justify-content:space-between}
.list{display:flex;flex-direction:column}
.list>.li{padding:11px 0;border-top:1px solid var(--line)}
.list>.li:first-child{border-top:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.75rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}

/* Próxima matéria: o destaque marca-texto */
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.next .hl{font-family:var(--f-display);font-weight:800;font-size:1.6rem;background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%);color:var(--ink);padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.plan{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.plan .blk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}

/* Cronômetro */
.clock{font-family:var(--f-mono);font-weight:700;font-size:clamp(3rem,13vw,6.5rem);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;text-align:center;padding:18px 0 8px}
.clock.running{color:var(--accent)}
.clock-sub{text-align:center;color:var(--muted);margin-bottom:18px}
.ctrl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ctrl .btn{min-width:120px;padding:12px 18px;font-size:1rem}
.pomo{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:14px}

/* Heatmap de constância */
.heat-wrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.heat-days{display:grid;grid-template-rows:repeat(7,12px);gap:3px;font-size:.65rem;color:var(--muted);line-height:12px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--sunk)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--sunk))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--sunk))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 80%,var(--sunk))}
.heat i[data-l="4"]{background:var(--accent)}
.heat i.today{outline:2px solid var(--mark);outline-offset:-1px}
.legend{display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* Gráficos de colunas */
.cols{display:grid;gap:8px;height:160px;padding-top:4px}
.cols .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%}
.cols .track{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;min-height:0}
.cols .b{width:100%;max-width:38px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.cols .b.zero{background:var(--sunk)}
.cols .t{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap;height:1.1em}
.cols .d{font-size:.72rem;color:var(--muted);white-space:nowrap}
.cols .d.now{color:var(--ink);font-weight:700}
.cols .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}

/* Edital */
details.mat{border-top:1px solid var(--line)}
details.mat:first-of-type{border-top:0}
details.mat>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;align-items:center;gap:12px}
details.mat>summary::-webkit-details-marker{display:none}
details.mat>summary .chev{transition:transform .15s;color:var(--muted)}
details.mat[open]>summary .chev{transform:rotate(90deg)}
.topics{padding:0 0 14px 22px;display:flex;flex-direction:column;gap:2px}
.topic{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px}
.topic:hover{background:var(--bg)}
.topic input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.topic.done .tn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.topic .tn{flex:1;min-width:0;overflow-wrap:anywhere}
.topic .meta{font-size:.78rem;color:var(--muted);white-space:nowrap}
.topic .acts{display:flex;gap:2px;opacity:.55}
.topic:hover .acts,.topic:focus-within .acts{opacity:1}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.empty p{margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.rail{position:sticky;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);z-index:5;gap:2px}
  .brand{display:none}
  .rail .timer-mini{margin-top:0;margin-left:6px;padding:9px 10px}
  main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2,.g3{grid-template-columns:1fr}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:1/-1}
  .topics{padding-left:4px}
  .topic .acts{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="shell">
  <nav class="rail" id="nav" aria-label="Seções">
    <div class="brand"><i></i>Mesa de Estudos</div>
    <a href="#hoje" data-v="hoje">Hoje</a>
    <a href="#cronometro" data-v="cronometro">Cronômetro</a>
    <a href="#registrar" data-v="registrar">Registrar estudo</a>
    <a href="#ciclo" data-v="ciclo">Ciclo de estudos</a>
    <a href="#edital" data-v="edital">Edital verticalizado</a>
    <a href="#revisoes" data-v="revisoes">Revisões <span class="badge" id="revBadge" hidden>0</span></a>
    <a href="#desempenho" data-v="desempenho">Desempenho</a>
    <a href="#historico" data-v="historico">Histórico</a>
    <a href="#ajustes" data-v="ajustes">Ajustes</a>
    <a class="timer-mini" id="timerMini" href="#cronometro" hidden>● 00:00:00</a>
    <div class="sync" id="syncInfo" aria-live="polite"></div>
  </nav>
  <main id="main">
    <div class="empty"><h2>Abrindo sua mesa de estudos…</h2><p>Carregando matérias, sessões e revisões.</p></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const fmtH = min => { min = Math.round(min||0); const h = Math.floor(min/60), m = min%60; return h ? `${h}h${m?pad(m):""}` : `${m}min`; };
const fmtClock = sec => { sec = Math.max(0, Math.floor(sec)); return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`; };
const DOW = ["dom","seg","ter","qua","qui","sex","sáb"];
const fmtDate = s => { const d = parseYmd(s); return `${DOW[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fmtShort = s => { const d = parseYmd(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const accClass = p => p == null ? "neutral" : p >= 80 ? "good" : p >= 65 ? "warn" : "bad";
const weekStart = s => { const d = parseYmd(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let toastT; const toast = msg => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); };
/* botão de confirmação em dois toques (a página não pode usar confirm()) */
const armed = (b, label) => { if (b.dataset.armed) return true; b.dataset.armed = 1; const old = b.textContent; b.textContent = label; b.classList.add("danger"); setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; b.classList.remove("danger"); } }, 4000); return false; };

const CORES = ["#3B6FE0","#D2533F","#2E9A6A","#B5862A","#8A5BD4","#D04E8E","#2B98B0","#7B8B2C","#C46A2B","#5C6BC0"];
const NOMES_COR = ["Azul","Vermelho","Verde","Ocre","Roxo","Rosa","Turquesa","Oliva","Laranja","Índigo"];
const CATEGORIAS = ["Teoria","Questões","Revisão","Leitura","Videoaula","Simulado","Lei seca"];
const CAT_REVISA = ["Teoria","Leitura","Videoaula","Lei seca"];
const MAX_TIMER_H = 8;

/* ---------- estado ---------- */
const S = { config: null, months: {}, loaded: false, mode: "local", note: "", lastSig: "", confirmado: false };
/* ===== CONFIGURAÇÃO: preencha com os dados do seu projeto Supabase (Project Settings → API) ===== */
const CONFIG = {
  supabaseUrl: "https://hdegaqyvolsqgydwuyau.supabase.co",
  supabaseKey: "sb_publishable_VhOaPtkqrlnx55GrhpiMLQ_5rZkHUbG"
};
/* ================================================================================================ */
let sb = null, userId = null, canal = null, sampleFn = null;
const sessoes = () => Object.values(S.months).flatMap(m => Array.isArray(m?.sessoes) ? m.sessoes : []);
const mat = id => S.config?.materias.find(m => m.id === id);
const topico = (m, id) => m?.topicos.find(t => t.id === id);

function normalizeConfig(c) {
  if (!c || typeof c !== "object") return null;
  c.materias = Array.isArray(c.materias) ? c.materias : [];
  const idOk = v => typeof v === "string" && /^[A-Za-z0-9_-]{1,40}$/.test(v);
  c.materias.forEach((m, i) => { if (!idOk(m.id)) m.id = uid(); m.nome = String(m.nome || "Matéria"); m.horasCiclo = Number(m.horasCiclo) || 0; if (!/^#[0-9a-f]{6}$/i.test(m.cor || "")) m.cor = CORES[i % CORES.length]; m.topicos = Array.isArray(m.topicos) ? m.topicos : []; m.topicos.forEach(t => { if (!idOk(t.id)) t.id = uid(); t.nome = String(t.nome || ""); t.feito = !!t.feito; }); });
  c.metaSemanal = Number(c.metaSemanal) || 20;
  c.revisoes = Array.isArray(c.revisoes) && c.revisoes.length ? c.revisoes.map(Number).filter(n => n > 0) : [1, 7, 30];

const materiaExiste = s => !!mat(s.materiaId);
function cicloStatus() {
  const mins = {};
  for (const s of sessoes()) if ((s.criadoEm || 0) >= S.config.cicloInicio) mins[s.materiaId] = (mins[s.materiaId] || 0) + (s.minutos || 0);
  const itens = S.config.materias.filter(m => m.horasCiclo > 0).map(m => {
    const alvo = m.horasCiclo * 60, feito = mins[m.id] || 0;
    return { m, alvo, feito, frac: Math.min(1, feito / alvo) };
  });
  const total = itens.reduce((a, i) => a + i.alvo, 0), feito = itens.reduce((a, i) => a + Math.min(i.feito, i.alvo), 0);
  const pend = itens.filter(i => i.frac < 1);
  // a próxima é a mais atrasada; empate fica com a ordem do edital
  const proxima = !pend.length ? null : S.config.cicloModo === "sequencia" ? pend[0] : pend.reduce((a, b) => b.frac < a.frac - 1e-9 ? b : a);
  return { itens, total, feito, proxima, completo: itens.length > 0 && !pend.length };
}
function minutosPorDia() { const r = {}; for (const s of sessoes()) r[s.data] = (r[s.data] || 0) + (s.minutos || 0); return r; }

function semanaAtual() {
  const ini = weekStart(today()); const dias = [...Array(7)].map((_, i) => addDays(ini, i));
  const pd = minutosPorDia(); const porDia = Object.fromEntries(dias.map(x => [x, pd[x] || 0]));
  return { dias, porDia, total: Object.values(porDia).reduce((a, b) => a + b, 0) };
}
function revisoesLista() {
  const out = [];
  for (const s of sessoes()) if (materiaExiste(s)) (s.revs || []).forEach((r, idx) => { if (!r.feita) out.push({ s, r, idx }); });
  return out.sort((a, b) => a.r.data.localeCompare(b.r.data));
}
function sequencia() {
  const dias = diasComEstudo(); let n = 0, d = today();
  if (!dias.has(d)) d = addDays(d, -1);
  while (dias.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function desempenho(desde = "") {
  const r = {};
  for (const s of sessoes()) {
    if (desde && s.data < desde) continue;
    const k = s.materiaId; r[k] ??= { min: 0, q: 0, a: 0, n: 0, topicos: {} };
    r[k].min += s.minutos || 0; r[k].q += s.questoes || 0; r[k].a += s.acertos || 0; r[k].n++;
    if (s.topicoId) { const t = r[k].topicos[s.topicoId] ??= { min: 0, q: 0, a: 0, ult: "" }; t.min += s.minutos || 0; t.q += s.questoes || 0; t.a += s.acertos || 0; if (s.data > t.ult) t.ult = s.data; }
  }

}
/* Sugestão do dia: reparte o que falta da meta semanal pelos dias de estudo restantes, em blocos de 50 min, sempre para a matéria mais atrasada do ciclo. */
function planoHoje() {
  const w = semanaAtual(), meta = S.config.metaSemanal * 60, t = today();
  const dias = S.config.diasEstudo.map(Number);
  const restantes = w.dias.filter(d => d >= t && dias.includes(parseYmd(d).getDay()));
  const hojeConta = dias.includes(parseYmd(t).getDay());
  const hojeMin = w.porDia[t] || 0;
  const antesHoje = w.total - hojeMin;
  const falta = Math.max(0, meta - antesHoje);
  const alvoHoje = hojeConta && restantes.length ? Math.ceil(falta / restantes.length / 10) * 10 : 0;
  const resta = Math.max(0, alvoHoje - hojeMin);
  const c = cicloStatus(); const proj = c.itens.filter(i => i.frac < 1).map(i => ({ ...i }));
  const blocos = [];
  let r = resta;
  while (r > 0 && proj.length && blocos.length < 6) {
    const min = Math.min(50, Math.max(20, r)); proj.sort((a, b) => a.feito / a.alvo - b.feito / b.alvo);
    const it = proj[0]; const last = blocos[blocos.length - 1];
    if (last && last.m.id === it.m.id) last.min += min; else blocos.push({ m: it.m, min });
    it.feito += min; if (it.feito >= it.alvo) proj.shift(); r -= min;
  }
  return { alvoHoje, hojeMin, resta, blocos, hojeConta, falta: Math.max(0, meta - w.total), restantes: restantes.length };
}

  mini.textContent = (T.running ? "● " : "❚❚ ") + fmtClock(e);
  document.title = T.running ? `${fmtClock(e)} · ${mat(T.materiaId)?.nome || "Estudando"}` : baseTitle;
  const c = $("#clock"); if (c) { c.textContent = fmtClock(e); c.classList.toggle("running", T.running); }
  const bar = $("#alvoBar"); if (bar && T.alvoMin) bar.style.width = Math.min(100, e / 60 / T.alvoMin * 100) + "%";
  if (T.running && T.alvoMin && !T.avisado && e >= T.alvoMin * 60) { T.avisado = true; saveT(); beep(); toast(`Bloco de ${T.alvoMin} min concluído. Hora de uma pausa.`); }
}, 500);

/* ---------- navegação ---------- */
const VIEWS = ["hoje","cronometro","registrar","ciclo","edital","revisoes","desempenho","historico","ajustes"];
let draft = null;     // pré-preenchimento do registro
let editId = null;    // sessão em edição
let revPend = null;   // revisão a marcar como feita ao salvar
let prevView = null;
const view = () => { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : "hoje"; };
window.addEventListener("hashchange", () => {
  if (prevView === "registrar" && view() !== "registrar") { editId = null; revPend = null; if (!draft?.doCronometro) draft = null; }
  if (prevView === "ciclo" && view() !== "ciclo") cicloEd = null;
  render(); window.scrollTo(0, 0);
});
const go = v => { if (location.hash.slice(1) === v) render(); else location.hash = v; };

function render() {
  const v = view(); prevView = v; pendingRender = false;
  $$("#nav a[data-v]").forEach(a => a.dataset.v === v ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const main = $("#main");
  if (sb && (!userId || AUTH.recuperando)) { $("#nav").hidden = true; main.innerHTML = viewAuth(); bindAuth(); return; }
  $("#nav").hidden = !userId;
  if (!S.loaded) return;
  const rb = $("#revBadge");
  if (S.config) { const n = revisoesLista().filter(x => x.r.data <= today()).length; rb.hidden = !n; rb.textContent = n; } else rb.hidden = true;
  if (!S.config && !S.confirmado) {
    main.innerHTML = S.note ? `<div class="empty"><h2>Não foi possível carregar seus dados</h2><p>${esc(S.note)}</p><p class="small">Para proteger o que você já registrou, a configuração inicial só aparece depois que seus dados forem lidos.</p><button class="btn" id="tentarDeNovo">Tentar de novo</button></div>`
      : `<div class="empty"><h2>Carregando seus dados…</h2></div>`;
    const tn = $("#tentarDeNovo"); if (tn) tn.onclick = () => { S.note = ""; render(); carregarDados(); };
    return;
  }
  if (!S.config) { main.innerHTML = viewSetup(); bindSetup(); return; }
  const note = S.note ? `<p class="notice">${esc(S.note)}</p>` : "";
  // preserva campos alterados e ainda não salvos (o snapshot ou um clique ao lado redesenham a tela)
  const keep = [];
  $$("#main input[id]:not([type=file]):not([type=hidden]), #main textarea[id]:not([readonly]), #main select[id]").forEach(el => {
    if (el.type === "checkbox") { if (el.checked !== el.defaultChecked) keep.push({ id: el.id, chk: el.checked, def: el.defaultChecked }); }
    else if (el.tagName === "SELECT") { const def = [...el.options].find(o => o.defaultSelected)?.value ?? el.options[0]?.value; if (el.value !== def) keep.push({ id: el.id, val: el.value, def }); }
    else if (el.value !== el.defaultValue) keep.push({ id: el.id, val: el.value, def: el.defaultValue });
  });
  const fns = { hoje: viewHoje, cronometro: viewCrono, registrar: viewRegistrar, ciclo: viewCiclo, edital: viewEdital, revisoes: viewRevisoes, desempenho: viewDesempenho, historico: viewHistorico, ajustes: viewAjustes };
  main.innerHTML = fns[v]().replace("<!--note-->", note);
  for (const k of keep) {
    const el = document.getElementById(k.id); if (!el || !$("#main").contains(el)) continue;
    if ("chk" in k) { if (el.defaultChecked === k.def) el.checked = k.chk; }
    else if (el.tagName === "SELECT") { const def = [...el.options].find(o => o.defaultSelected)?.value ?? el.options[0]?.value; if (def === k.def && [...el.options].some(o => o.value === k.val)) el.value = k.val; }
    else if (el.defaultValue === k.def) el.value = k.val;
  }
  (binders[v] || (() => {}))();
}

        ${colChart(w.dias.map(d => ({ v: w.porDia[d], t: w.porDia[d] ? fmtH(w.porDia[d]) : "", d: DOW[parseYmd(d).getDay()], now: d === today() })), max, p.hojeConta && p.alvoHoje ? p.alvoHoje : 0)}</div>

function colChart(items, max, goal = 0) {
  return `<div class="cols" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))">${items.map(it => `<div class="col"><span class="t">${esc(it.t)}</span>
    <div class="track">${goal ? `<span class="goal" style="bottom:${goal / max * 100}%" title="Meta do dia"></span>` : ""}<div class="b ${it.v ? "" : "zero"}" style="height:${it.v ? Math.max(3, it.v / max * 100) : 2}%;${it.color ? `background:${it.color}` : ""}"></div></div>
    <span class="d ${it.now ? "now" : ""}">${esc(it.d)}</span></div>`).join("")}</div>`;
}
function heatmap(semanas) {
  const pd = minutosPorDia(), dias = diasComEstudo(); const ini = addDays(weekStart(today()), -(semanas - 1) * 7), t = today(); let cells = "";
  for (let i = 0; i < semanas * 7; i++) {
    const x = addDays(ini, i); const m = pd[x] || 0;
    const l = x > t ? -1 : !dias.has(x) ? 0 : m < 60 ? 1 : m < 120 ? 2 : m < 240 ? 3 : 4;
    cells += l < 0 ? `<i style="visibility:hidden"></i>` : `<i data-l="${l}" class="${x === t ? "today" : ""}" title="${fmtDate(x)}: ${fmtH(m)}"></i>`;
  }
  return `<div class="heat-wrap"><div class="heat-days"><span>seg</span><span></span><span>qua</span><span></span><span>sex</span><span></span><span>dom</span></div><div class="heat">${cells}</div></div>
    <div class="legend" style="margin-top:8px">0 <i style="background:var(--sunk)"></i><i style="background:color-mix(in srgb,var(--accent) 30%,var(--sunk))"></i><i style="background:color-mix(in srgb,var(--accent) 55%,var(--sunk))"></i><i style="background:color-mix(in srgb,var(--accent) 80%,var(--sunk))"></i><i style="background:var(--accent)"></i> 4h+</div>`;
}
function revItem({ s, r, idx }) {

}

function optsMaterias(sel) { const ms = S.config.materias; const orf = sel && !mat(sel) ? `<option value="${esc(sel)}" selected>Matéria removida</option>` : ""; return `<option value="">Escolha a matéria</option>${orf}` + ms.map(m => `<option value="${m.id}" ${m.id === sel ? "selected" : ""}>${esc(m.nome)}</option>`).join(""); }

function bindRegistrar() {
  let cat = $("#rCat [aria-pressed=true]")?.dataset.c || "Teoria";
  $("#rMat").onchange = e => $("#rTop").innerHTML = optsTopicos(e.target.value, "");
  $$("#rCat .chip").forEach(b => b.onclick = () => {
    cat = b.dataset.c; $$("#rCat .chip").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (!editId) $("#rRev").checked = CAT_REVISA.includes(cat);
  });
  const c = $("#rCancel"); if (c) c.onclick = () => { editId = null; go("historico"); };
  const dsc = $("#rDescarta"); if (dsc) dsc.onclick = () => { draft = null; render(); toast("Tempo do cronômetro descartado"); };
  $("#rForm").onsubmit = e => {
    e.preventDefault();
    const n = id => Math.max(0, parseInt($(id).value, 10) || 0);
    const s = { data: $("#rData").value || today(), materiaId: $("#rMat").value, topicoId: $("#rTop").value, categoria: cat, minutos: Math.min(1440, n("#rMin")), questoes: n("#rQ"), acertos: n("#rA"), paginas: n("#rP"), aulas: n("#rAu"), nota: $("#rNota").value.trim() };
    const err = !s.materiaId ? "Escolha a matéria." : !editId && !mat(s.materiaId) ? "Essa matéria foi excluída. Escolha uma matéria cadastrada." : s.data > today() ? "A data não pode estar no futuro." : !s.minutos && !s.questoes && !s.paginas && !s.aulas ? "Informe o tempo, as questões, as páginas ou as aulas." : s.acertos > s.questoes ? "Acertos não podem passar do número de questões." : "";
    if (err) { $("#rErr").textContent = err; return; }

    if (editId) {
      const f = findSessao(editId); if (!f) { editId = null; go("historico"); return; }
      const novo = { ...f.s, ...s };
      if ($("#rRev").checked && f.s.data !== s.data) novo.revs = (f.s.revs || []).map(r => r.feita ? r : { ...r, data: addDays(s.data, r.d) });
      if (monthKey(s.data) !== f.k) { S.months[f.k].sessoes.splice(f.i, 1); saveMonth(f.k); const k = monthKey(s.data); (S.months[k] ??= { sessoes: [] }).sessoes.push(novo); saveMonth(k); }
      else { S.months[f.k].sessoes[f.i] = novo; saveMonth(f.k); }
      editId = null; toast("Sessão atualizada"); go("historico"); return;
    }
    s.id = uid(); s.criadoEm = Date.now();
    s.revs = $("#rRev").checked ? S.config.revisoes.map(d => ({ d, data: addDays(s.data, d), feita: false })) : [];
    const k = monthKey(s.data); (S.months[k] ??= { sessoes: [] }).sessoes.push(s); saveMonth(k);
    if (revPend) { marcarRevisao(revPend.id, revPend.idx); revPend = null; }
    if ($("#rDone").checked && s.topicoId) { const t = topico(mat(s.materiaId), s.topicoId); if (t && !t.feito) { t.feito = true; saveConfig(); } }
    draft = null; toast(s.minutos ? `Sessão de ${fmtH(s.minutos)} salva` : "Sessão salva"); go("hoje");
  };
}

function bindCiclo() {

}
function bindCicloEdit() {
  const ed = cicloEd; const it = id => ed.itens.find(i => i.id === id);
  const lerHoras = () => $$("[data-ch]").forEach(inp => { const v = parseFloat(String(inp.value).replace(",", ".")); const i = it(inp.dataset.ch); if (i && v > 0) i.horas = Math.min(40, Math.round(v * 2) / 2); });
  const total = () => ed.itens.filter(i => i.horas > 0).reduce((a, i) => a + i.horas, 0);
  $$("[data-ch]").forEach(inp => inp.oninput = () => { lerHoras(); $("#cTotal").textContent = String(total()).replace(".", ","); });
  $$("[data-modo]").forEach(b => b.onclick = () => { lerHoras(); ed.modo = b.dataset.modo; render(); });
  $$("[data-cmove]").forEach(b => b.onclick = () => {
    lerHoras(); const [id, dir] = b.dataset.cmove.split(":"); const dentro = ed.itens.filter(i => i.horas > 0);
    const k = dentro.findIndex(i => i.id === id), alvo = dentro[k + +dir]; if (!alvo) return;
    const a = ed.itens.findIndex(i => i.id === id), c = ed.itens.indexOf(alvo); [ed.itens[a], ed.itens[c]] = [ed.itens[c], ed.itens[a]]; render();
  });
  $$("[data-cout]").forEach(b => b.onclick = () => { lerHoras(); const i = it(b.dataset.cout); i.antes = i.horas; i.horas = 0; render(); });
  $$("[data-cin]").forEach(b => b.onclick = () => { lerHoras(); const i = it(b.dataset.cin); i.horas = i.antes || 2; render(); });
  let dm = "igual";
  $$("#cDistModo .chip").forEach(b => b.onclick = () => { dm = b.dataset.dm; $$("#cDistModo .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  $("#cDist").onclick = () => {
    lerHoras(); const tot = Math.max(1, parseFloat($("#cDistTot").value) || 0); const dentro = ed.itens.filter(i => i.horas > 0); if (!dentro.length) return;
    const dp = desempenho();
    const peso = i => dm === "igual" ? 1 : dm === "prop" ? i.horas : (() => { const d = dp[i.id]; const p = d?.q ? d.a / d.q : .65; return 0.5 + Math.max(0, 1 - p) * 2; })();
    const soma = dentro.reduce((a, i) => a + peso(i), 0);
    // reparte em meias horas pelo método do maior resto, mínimo de 30 min por matéria
    const meias = Math.round(tot * 2); const bruto = dentro.map(i => ({ i, q: Math.max(1, meias * peso(i) / soma) }));
    bruto.forEach(x => x.n = Math.max(1, Math.floor(x.q)));
    let resto = meias - bruto.reduce((a, x) => a + x.n, 0);
    [...bruto].sort((a, b) => (b.q - Math.floor(b.q)) - (a.q - Math.floor(a.q))).forEach(x => { if (resto > 0) { x.n++; resto--; } });
    while (resto < 0) { const x = bruto.filter(y => y.n > 1).sort((a, b) => b.n - a.n)[0]; if (!x) break; x.n--; resto++; }
    bruto.forEach(x => x.i.horas = x.n / 2); render(); toast(`${String(total()).replace(".", ",")}h distribuídas`);
  };
  $("#cNova").onsubmit = e => { e.preventDefault(); lerHoras(); const nome = $("#cnNome").value.trim(); if (!nome) { $("#cnNome").focus(); return; }
    if (ed.itens.some(i => chave(i.nome) === chave(nome))) { toast("Já existe uma matéria com esse nome"); return; }
    ed.itens.push({ id: uid(), nome, cor: CORES[ed.itens.length % CORES.length], horas: Math.max(0.5, Math.round((parseFloat($("#cnH").value) || 2) * 2) / 2), antes: 2, nova: true }); render(); };
  $("#cCancel").onclick = () => { cicloEd = null; render(); };
  $("#cSave").onclick = () => {
    lerHoras();
    const atuais = Object.fromEntries(S.config.materias.map(m => [m.id, m]));
    // matérias excluídas no Edital durante a edição continuam excluídas
    S.config.materias = ed.itens.filter(i => atuais[i.id] || i.nova).map(i => { const m = atuais[i.id] || { id: i.id, nome: i.nome, cor: i.cor, topicos: [] }; m.horasCiclo = i.horas > 0 ? i.horas : 0; return m; });
    const ids = new Set(ed.itens.map(i => i.id));
    Object.values(atuais).forEach(m => { if (!ids.has(m.id)) S.config.materias.push(m); });
    S.config.cicloModo = ed.modo;
    if ($("#cZerar").checked) S.config.cicloInicio = Date.now();
    cicloEd = null; saveConfig(); render(); toast("Ciclo salvo");
  };
}

const IMP = { aberto: false, texto: "", origem: "", cargo: "", status: "", erro: "", ocupado: false, resultado: null, modo: "somar", abertos: new Set(), ctrl: null };
const semAcento = s => [...String(s)].map(ch => ch.normalize("NFD")[0]).join("");   // mesmo comprimento do original
const chave = s => semAcento(String(s).toLowerCase()).replace(/[^a-z0-9]/g, "");
const MINUS = new Set("a ao aos as à às com da das de do dos e em na nas no nos o os ou para pela pelas pelo pelos por sobre".split(" "));
const NAO_SIGLA = new Set(["lei","uso","seu","sua","não","sem","ser","ter","fim","rio","mar"]);
function tituloCaso(s) {
  s = s.trim().replace(/\s+/g, " ").replace(/^(?:\d+(?:\.\d+)*\.?|[IVXLC]+\s*[.)\-–]|[a-z]\s*[.)\-–])\s+/i, "").replace(/[\s:.\-–]+$/, "");
  if (/[a-zà-ú]/.test(s)) return s;
  return s.split(" ").map((w, i) => { const l = w.toLowerCase();
    if (w.includes("-") && w.length <= 8) return w;
    const nu = w.replace(/[^A-Za-zÀ-ú]/g, "");
    if (nu.length >= 2 && nu.length <= 4 && /^[A-ZÀ-Ú]+$/.test(nu) && (nu.length <= 3 || /^\(.*\)$/.test(w)) && !MINUS.has(nu.toLowerCase()) && !NAO_SIGLA.has(nu.toLowerCase())) return w;
    if (i > 0 && MINUS.has(l)) return l;
    return l.charAt(0).toUpperCase() + l.slice(1); }).join(" ");
}
function casarMateria(nome) {
  const k = chave(nome); let parcial = null;
  for (const m of S.config.materias) { const mk = chave(m.nome); if (mk === k) return m.id; if (!parcial && k.length > 5 && mk.length > 5 && (k.includes(mk) || mk.includes(k))) parcial = m.id; }
  return parcial;
}
function mesclarMaterias(lista) {
  const mapa = new Map();
  for (const x of lista) {
    const nome = tituloCaso(String(x?.nome || "")); const k = chave(nome); if (k.length < 3) continue;
    const alvo = mapa.get(k) || { nome, topicos: [], vistos: new Set() }; mapa.set(k, alvo);
    for (let t of Array.isArray(x.topicos) ? x.topicos : []) {
      t = String(t || "").replace(/\s+/g, " ").replace(/[.;]?\s+\d{1,2}(?:\.\d{1,2})+\.?\s+(?=[A-ZÀ-Ú])/g, "; ").replace(/^[\s\d.)\-–•]+(?=[A-Za-zÀ-ú"“(])/, "").replace(/[\s.;,]+$/, "").trim();
      if (t.length > 260) t = t.slice(0, 257).trimEnd() + "…";
      const kt = chave(t); if (t.length < 3 || alvo.vistos.has(kt)) continue; alvo.vistos.add(kt); alvo.topicos.push(t);
    }
  }
  return [...mapa.values()].filter(m => m.topicos.length).map(m => ({ nome: m.nome, topicos: m.topicos.slice(0, 250), incluir: true, horas: 2, alvoId: casarMateria(m.nome) }));
}

/* Leitura de PDF com pdf.js (carregado só quando necessário; roda na própria página) */
let pdfPronto = null;
const loadScript = src => new Promise((ok, erro) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => erro(new Error("script")); document.head.appendChild(el); });
function carregarPdfJs() {
  return pdfPronto ||= (async () => {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base + "pdf.worker.min.js"); await loadScript(base + "pdf.min.js");
    const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; return lib;
  })().catch(e => { pdfPronto = null; throw e; });
}
const impStatus = msg => { IMP.status = msg; const el = $("#impStatus"); if (el) { el.textContent = msg; el.style.color = ""; } };
async function extrairPdf(file) {
  impStatus("Preparando a leitura do PDF…");
  const lib = await carregarPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const paginas = [];
  for (let i = 1; i <= doc.numPages; i++) {
    impStatus(`Lendo página ${i} de ${doc.numPages}…`);
    const tc = await (await doc.getPage(i)).getTextContent();
    let t = ""; for (const it of tc.items) { t += it.str || ""; t += it.hasEOL ? "\n" : (it.str && !/\s$/.test(it.str) ? " " : ""); }
    paginas.push(t.replace(/[ \t]+/g, " "));
  }
  // remove cabeçalhos e rodapés que se repetem em muitas páginas
  const norm = l => l.trim().replace(/\d+/g, "#").replace(/\s+/g, " ").toLowerCase();
  const freq = {}; paginas.forEach(p => new Set(p.split("\n").map(norm).filter(l => l.length > 3)).forEach(l => freq[l] = (freq[l] || 0) + 1));
  const lim = Math.max(3, doc.numPages * 0.3);
  return paginas.map(p => p.split("\n").filter(l => doc.numPages < 4 || (freq[norm(l)] || 0) < lim).join("\n")).join("\n");
}

/* Reconhecimento sem IA */
const RE_TITULO = /([A-ZÁÂÃÀÉÊÍÓÔÕÚÇ][A-ZÁÂÃÀÉÊÍÓÔÕÚÇ0-9 ,\-–\/()ºª]{2,100}?)\s*:/g;
const RE_LINHA = /^[A-ZÁÂÃÀÉÊÍÓÔÕÚÇIVX0-9][A-ZÁÂÃÀÉÊÍÓÔÕÚÇ0-9 ,\-–\/()ºª.]{3,100}$/;
const GRUPO = /^(conhecimentos|parte|bloco|modulo|grupo|cargo|cargos|anexo|nivel|disciplinas|prova|provas|conteudo|conteudos|objetos|habilidades|eixo|area|especialidade|para todos|d[ao]s?|edital|cronograma|quadro|tabela|item|subitem)\b/;
const letras = t => t.replace(/[^A-Za-zÀ-ú]/g, "").length;
function acharTitulos(txt) {
  const out = [];
  for (const m of txt.matchAll(RE_TITULO)) { const t = m[1].trim(); if (letras(t) >= 4 && t.split(/\s+/).length <= 14) out.push({ i: m.index, fim: m.index + m[0].length, t }); }
  let pos = 0;
  for (const linha of txt.split("\n")) { const t = linha.trim(); if (RE_LINHA.test(t) && letras(t) >= 4 && !/[a-zà-ú]/.test(t) && !/:$/.test(t)) { const i = pos + linha.indexOf(t); out.push({ i, fim: i + t.length, t }); } pos += linha.length + 1; }
  out.sort((a, b) => a.i - b.i);
  const limpo = []; for (const h of out) if (!limpo.length || h.i >= limpo[limpo.length - 1].fim) limpo.push(h);
  return limpo.map(h => ({ ...h, grupo: GRUPO.test(semAcento(tituloCaso(h.t).toLowerCase())) || /\bCARGO\b/.test(h.t) }));
}
function separarTopicos(conteudo) {
  const c = conteudo.replace(/\s+/g, " ").trim();
  const re = /(?<![\d.,ºª°\/\-])\b(\d{1,2})(?:\s*[.)\-–]|\s)\s*(?=[A-ZÁÂÃÀÉÊÍÓÔÕÚÇ"“(])/g;
  const cadeia = []; let esperado = 1;
  for (const m of c.matchAll(re)) if (+m[1] === esperado) { cadeia.push(m); esperado++; }
  if (cadeia.length >= 2) return cadeia.map((m, k) => c.slice(m.index + m[0].length, k + 1 < cadeia.length ? cadeia[k + 1].index : c.length));
  const pv = c.split(/\s*;\s*/); if (pv.length >= 2) return pv;
  const pf = c.split(/\.\s+(?=[A-ZÁÂÃÀÉÊÍÓÔÕÚÇ])/); if (pf.length >= 2) return pf;
  return c.length >= 3 ? [c] : [];
}
function reconhecer(txt) {
  const tit = acharTitulos(txt); const brutas = [];
  tit.forEach((h, k) => {
    if (h.grupo) return;
    let conteudo = txt.slice(h.fim, k + 1 < tit.length ? tit[k + 1].i : txt.length).slice(0, 25000);
    // o conteúdo da última matéria não pode engolir o resto do edital (próximo item do edital ou anexo)
    const corte = conteudo.search(/\n\s*(?:ANEXO\b|\d{1,2}(?:\.\d{1,2})*\.?\s+D[AO]S?\s+[A-ZÁÂÃÉÊÍÓÔÕÚÇ]{3})/); if (corte > 0) conteudo = conteudo.slice(0, corte);
    if (conteudo.replace(/\s/g, "").length < 12) return;
    const nome = tituloCaso(h.t); if (nome.length < 4 || nome.length > 90) return;
    brutas.push({ nome, topicos: separarTopicos(conteudo) });
  });
  return mesclarMaterias(brutas);
}
/* Escolhe onde começa o conteúdo programático (e, se informado, o cargo) */
function recortar(txt, cargo, usarCargo) {
  const low = semAcento(txt.toLowerCase());
  const cands = [];
  for (const k of ["conteudos programaticos", "conteudo programatico", "objetos de avaliacao", "programa das provas", "programas das provas"]) {
    let i = low.indexOf(k); while (i >= 0) { cands.push(i); i = low.indexOf(k, i + 1); }
  }
  let ini = 0;
  if (cands.length) { // fica com a ocorrência seguida de mais títulos de matéria
    let melhor = -1; for (const i of cands) { const n = acharTitulos(txt.slice(i, i + 20000)).filter(h => !h.grupo).length; if (n > melhor) { melhor = n; ini = i; } }
  }
  let achouCargo = null;
  if (cargo && usarCargo) { const j = low.indexOf(semAcento(cargo.toLowerCase()).trim(), ini); achouCargo = j >= 0; if (j >= 0) ini = j; }
  return { trecho: txt.slice(ini), achouCargo };
}

const promptEdital = (trecho, k, n, cargo) => `Você está ajudando a montar um edital verticalizado de concurso público brasileiro.
Abaixo está ${n > 1 ? `a parte ${k + 1} de ${n} de ` : ""}um trecho do edital (texto extraído de PDF, com quebras de linha soltas e possíveis cabeçalhos ou rodapés de página no meio).

- Cada item numerado de nível superior (1, 2, 3...) vira um tópico. Subitens (1.1, 1.2...) ficam dentro do tópico pai, separados por "; ".
- Sem numeração, separe os assuntos pelos pontos e vírgulas ou pelos pontos finais.

- Se o trecho não tiver conteúdo programático, use "materias": [].
- Use "fim": true se todo o conteúdo programático já terminou dentro deste trecho (começou um anexo de outro assunto ou o fim do edital); senão "fim": false.

const ERROS_IA = { not_granted: "O uso do Claude nesta página não foi permitido. Use o reconhecimento automático ou libere nas permissões da página.", sampling_disabled: "O Claude não está disponível nesta conta para páginas. Use o reconhecimento automático.", rate_limited: "Limite de uso do Claude atingido no momento. Tente mais tarde ou use o reconhecimento automático.", session_expired: "Sua sessão expirou. Entre novamente e tente de novo.", prompt_too_large: "O trecho ficou grande demais. Informe o cargo ou cole só o conteúdo programático.", invalid_json: "A resposta veio incompleta. Informe o cargo para reduzir o trecho ou cole só o conteúdo programático.", refused: "O Claude não conseguiu processar este texto. Use o reconhecimento automático." };
async function lerComClaude() {
  const { trecho } = recortar(IMP.texto, IMP.cargo, false);
  const TAM = 60000, partes = [];
  for (let i = 0; i < trecho.length && partes.length < 8; i += TAM) partes.push(trecho.slice(i, i + TAM));
  const cortado = trecho.length > TAM * 8;
  IMP.ctrl ||= new AbortController(); const todas = [];
  try {
    for (let k = 0; k < partes.length; k++) {
      impStatus(`O Claude está lendo o edital${partes.length > 1 ? ` (parte ${k + 1} de ${partes.length})` : ""}… isso pode levar um minuto.`);
      const r = await sampleFn.json(promptEdital(partes[k], k, partes.length, IMP.cargo.trim()), { signal: IMP.ctrl.signal, modelTier: "default" });
      if (Array.isArray(r?.materias)) todas.push(...r.materias);
      if (r?.fim === true && todas.length) break;
    }
  } catch (e) {
    if (e?.code === "cancelled") { IMP.erro = todas.length ? "" : "Leitura cancelada."; }
    else if (!todas.length) throw e;
    else IMP.erro = "Parte do edital não pôde ser lida; revise se faltou alguma matéria.";
  } finally { IMP.ctrl = null; }
  if (cortado) IMP.erro = "O edital é muito longo e só o começo do conteúdo foi lido. Informe o cargo ou cole o trecho que falta.";
  return mesclarMaterias(todas);
}

function lerRevisao() {

    const c = $("#imp_c_" + i); if (!c) return;
    x.incluir = c.checked; x.nome = $("#imp_n_" + i).value; x.alvoId = $("#imp_a_" + i).value || null;
    x.horas = Math.max(0, Math.round((parseFloat(String($("#imp_h_" + i).value).replace(",", ".")) || 0) * 2) / 2);

function aplicarImport() {
  lerRevisao();
  const sel = IMP.resultado.filter(x => x.incluir && x.nome.trim() && x.topicos.length);
  if (!sel.length) { toast("Marque ao menos uma matéria com tópicos"); return; }
  let nM = 0, nT = 0;
  if (IMP.modo === "somar") {
    for (const x of sel) {
      let m = x.alvoId && mat(x.alvoId);
      if (!m) { m = { id: uid(), nome: x.nome.trim(), horasCiclo: x.horas, cor: CORES[S.config.materias.length % CORES.length], topicos: [] }; S.config.materias.push(m); nM++; }
      const ex = new Set(m.topicos.map(t => chave(t.nome)));
      for (const t of x.topicos) { const k = chave(t); if (!ex.has(k)) { m.topicos.push({ id: uid(), nome: t, feito: false }); ex.add(k); nT++; } }
    }
  } else {
    const usados = new Set(), novas = [];
    for (const x of sel) {
      const old = x.alvoId && !usados.has(x.alvoId) ? mat(x.alvoId) : null; if (old) usados.add(old.id);
      const porNome = new Map((old?.topicos || []).map(t => [chave(t.nome), t]));
      const m = old ? { ...old, nome: x.nome.trim() } : { id: uid(), nome: x.nome.trim(), horasCiclo: x.horas, cor: CORES[novas.length % CORES.length], topicos: [] };
      if (!old) nM++;
      const vistos = new Set();
      m.topicos = x.topicos.filter(t => { const k = chave(t); if (vistos.has(k)) return false; vistos.add(k); return true; }).map(t => porNome.get(chave(t)) || { id: uid(), nome: t, feito: false });
      nT += m.topicos.length; novas.push(m);
    }
    S.config.materias = novas;
  }
  saveConfig();
  Object.assign(IMP, { aberto: false, resultado: null, texto: "", origem: "", status: "", erro: "", abertos: new Set() });

}
function bindImportEdital() {
  ["#impAbrir", "#impAbrir2"].forEach(id => { const b = $(id); if (b) b.onclick = () => { IMP.aberto = true; if (!IMP.cargo && /técnico de controle externo/i.test(S.config.objetivo)) IMP.cargo = "Técnico de Controle Externo"; render(); $("#impTexto")?.focus(); }; });

    } catch (e) {
      IMP.erro = e?.name === "PasswordException" ? "O PDF está protegido por senha. Remova a senha ou cole o texto." : e?.message === "script" ? "Não foi possível carregar o leitor de PDF. Confira a conexão ou cole o texto." : "Não foi possível ler este arquivo. Tente outro PDF ou cole o texto.";
    }

  };
  const semTexto = () => { if (IMP.texto.trim().length >= 20) return false; IMP.erro = "Escolha o PDF do edital ou cole o texto antes de reconhecer."; render(); return true; };
  const auto = $("#impAuto");

    if (semTexto()) return;

    if (!r.length) { IMP.erro = `Não reconheci nenhuma matéria.${sampleFn ? " Tente “Ler com Claude”" : " Cole só o trecho do conteúdo programático"} ou confira o texto.`; IMP.status = ""; render(); return; }
    IMP.erro = achouCargo === false ? `O cargo “${IMP.cargo}” não foi encontrado no texto; mostrei tudo o que reconheci. Desmarque o que não for do seu cargo.` : IMP.cargo ? "" : "Sem cargo informado: se o edital tiver vários cargos, desmarque as matérias que não são do seu.";
    IMP.resultado = r; IMP.abertos = new Set(); render();
  };
  const ia = $("#impIA");
  if (ia) ia.onclick = async () => {
    if (semTexto()) return;
    Object.assign(IMP, { ocupado: true, erro: "", status: "O Claude está lendo o edital…", ctrl: new AbortController() }); render();
    try {
      const r = await lerComClaude();
      if (r.length) { IMP.resultado = r; IMP.abertos = new Set(); IMP.status = ""; }
      else if (!IMP.erro) IMP.erro = "O Claude não encontrou conteúdo programático neste texto. Confira se o PDF certo foi enviado ou informe o cargo exatamente como está no edital.";
    } catch (e) { IMP.erro = ERROS_IA[e?.code] || "Não foi possível ler com o Claude agora. Tente de novo ou use o reconhecimento automático."; if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e?.code)) sampleFn = null; }
    IMP.ocupado = false; render();
  };
  const canc = $("#impCancelar"); if (canc) canc.onclick = () => IMP.ctrl?.abort();
  if (IMP.resultado) {
    $$("[id^=imp_]", $("#main")).forEach(el => el.addEventListener("change", lerRevisao));
    $$("[id^=imp_a_]").forEach(sel => sel.addEventListener("change", () => { const i = sel.id.slice(6); const hl = $("#imp_hl_" + i); if (hl) hl.hidden = !!sel.value; }));
    $$("[data-impd]").forEach(d => d.ontoggle = () => d.open ? IMP.abertos.add(+d.dataset.impd) : IMP.abertos.delete(+d.dataset.impd));
    $$("[data-impmodo]").forEach(b => b.onclick = () => { lerRevisao(); IMP.modo = b.dataset.impmodo; render(); });
    $("#impVoltar").onclick = () => { lerRevisao(); IMP.resultado = null; IMP.erro = ""; render(); };
    const ap = $("#impAplicar"); ap.onclick = () => { if (IMP.modo === "substituir" && !armed(ap, "Confirmar substituição")) return; aplicarImport(); };
  }
}

    <label class="field span2"><span>Objetivo (aparece no topo do painel)</span><input type="text" id="aObj" value="${esc(S.config.objetivo)}" maxlength="80"></label>
    <label class="field"><span>Data da prova</span><input type="date" id="aProva" value="${esc(S.config.dataProva)}"></label>
    <label class="field"><span>Meta semanal (horas)</span><input type="number" id="aMeta" min="1" max="100" step="1" value="${S.config.metaSemanal}"></label>
    <label class="field span2"><span>Intervalos de revisão (dias, separados por vírgula)</span><input type="text" id="aRev" value="${S.config.revisoes.join(", ")}"></label>
    <div class="field span2"><span>Dias em que você estuda (usados no plano de hoje)</span><div class="chips" id="aDias" role="group" aria-label="Dias de estudo">${[1,2,3,4,5,6,0].map(d => `<button type="button" class="chip" data-dia="${d}" aria-pressed="${S.config.diasEstudo.includes(d)}">${DOW[d]}</button>`).join("")}</div></div>
    <div class="field span4"><div class="row end"><button class="btn primary" type="submit">Salvar ajustes</button></div></div>
  </div></form>
  <div class="grid g2" style="margin-top:16px">
    <div class="panel"><h2>Backup</h2><p class="muted" style="margin:8px 0 14px">Exporte tudo (matérias, sessões e revisões) em um arquivo .json para guardar ou levar para outra conta.</p>
      <div class="row wrap"><button class="btn" id="expBtn">Exportar backup</button><button class="btn ghost" id="expCopy">Copiar dados</button></div>
      <textarea id="expArea" readonly hidden style="margin-top:10px" aria-label="Dados do backup"></textarea></div>
    <div class="panel"><h2>Restaurar</h2><p class="muted" style="margin:8px 0 14px">Escolha um arquivo exportado por esta página.</p>${importControl()}</div>
  </div>
  <div class="panel" style="margin-top:16px"><h2 style="margin-bottom:8px">Onde seus dados ficam</h2>
    <p class="muted" style="max-width:65ch">Matérias, sessões e revisões ficam salvas na sua conta e sincronizam entre os aparelhos em que você entrar. Sem internet, o app continua funcionando com a cópia deste aparelho e envia as alterações quando a conexão voltar. O cronômetro em andamento fica só neste aparelho.</p></div>
  <div class="panel" style="margin-top:16px"><div class="ph"><h2>Conta</h2></div>
    <div class="row wrap between"><span class="muted">Conectado como <b style="color:var(--ink)">${esc(S.email)}</b></span><button class="btn" id="sair">Sair da conta</button></div></div>`;
}
function backupJson() { return JSON.stringify({ app: "mesa-de-estudos", versao: 2, exportadoEm: new Date().toISOString(), config: S.config, meses: S.months }, null, 1); }
function bindAjustes() {
  $$("#aDias .chip").forEach(b => b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"));
  $("#aForm").onsubmit = e => { e.preventDefault();
    const revs = $("#aRev").value.split(/[,;\s]+/).map(Number).filter(n => Number.isInteger(n) && n > 0 && n < 400);
    const dias = $$("#aDias .chip[aria-pressed=true]").map(b => +b.dataset.dia);
    S.config.objetivo = $("#aObj").value.trim(); S.config.dataProva = $("#aProva").value; S.config.metaSemanal = Math.min(100, Math.max(1, parseInt($("#aMeta").value, 10) || 20));
    if (revs.length) S.config.revisoes = [...new Set(revs)].sort((a, b) => a - b);
    if (dias.length) S.config.diasEstudo = dias;
    saveConfig(); render(); toast(!dias.length ? "Ajustes salvos. Marque ao menos um dia de estudo; os dias anteriores foram mantidos." : revs.length ? "Ajustes salvos" : "Ajustes salvos. Os intervalos de revisão eram inválidos e foram mantidos."); };
  const showArea = () => { const a = $("#expArea"); a.value = backupJson(); a.hidden = false; a.focus(); a.select(); };
  $("#expBtn").onclick = async () => {
    try {
      const url = URL.createObjectURL(new Blob([backupJson()], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = `mesa-de-estudos-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000); toast("Backup baixado");
    } catch { showArea(); toast("Não deu para baixar. Copie o texto abaixo."); }
  };
  $("#expCopy").onclick = async () => { try { await navigator.clipboard.writeText(backupJson()); toast("Dados copiados"); } catch { showArea(); toast("Selecione e copie o texto abaixo"); } };
  bindImport();
  $("#sair").onclick = async () => {
    const n = pendentesLocais().size;
    if (n && !armed($("#sair"), `Há ${n} alteração(ões) não enviadas. Sair mesmo assim?`)) return;
    try { localStorage.removeItem(chaveCache()); localStorage.removeItem(chavePend()); } catch {}
    await sb.auth.signOut().catch(() => {}); trocarUsuario(null);
  };
}

if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
render();
boot();
})();
</script>
</body>
</html>
